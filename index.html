<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Join My Roblox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Base ── */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-primary: #0b0814;
            --text-primary: #f0ecff;
            --text-secondary: #b8aeeb;
            --text-muted: #8a7ec4;
            --accent-purple: #7c5cfc;
            --radius-video: 20px;
            --radius-btn: 14px;
            --font-display: 'Orbitron', monospace;
            --font-body: 'Inter', sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html { font-size:16px; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px 40px;
            background-image: url('background.png'), linear-gradient(135deg, #0b0814, #1a1040);
            background-size: cover, cover;
            background-position: center, center;
            background-attachment: fixed, fixed;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(11, 8, 20, 0.65);
            backdrop-filter: blur(1px);
            z-index: 0;
            pointer-events: none;
        }
        .sparkles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #c8b0ff;
            border-radius: 50%;
            box-shadow: 0 0 6px 1px rgba(160, 120, 255, 0.5);
            animation: twinkle var(--dur, 4s) ease-in-out infinite alternate;
            opacity: 0;
        }
        @keyframes twinkle {
            0% { opacity:0; transform:scale(0.5); }
            50% { opacity:1; transform:scale(1.2); }
            100% { opacity:0.3; transform:scale(0.8); }
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 6px 0 4px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius-video);
            overflow: hidden;
            border: 2px solid rgba(120, 80, 255, 0.3);
            box-shadow: 0 0 20px rgba(120, 80, 255, 0.2);
            cursor: pointer;
            transition: transform 0.2s;
            background: #0e0a1a;
        }
        .video-wrapper:hover {
            transform: scale(1.01);
            border-color: rgba(120, 80, 255, 0.6);
        }
        .video-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-wrapper::before {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 40px rgba(120, 80, 255, 0.6);
            opacity: 0.9;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2;
        }
        .video-wrapper:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .profile-title {
            margin-top: 14px;
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-secondary);
            text-shadow: 0 2px 12px rgba(0,0,0,0.6);
        }
        .profile-title span {
            font-weight: 600;
            color: var(--accent-purple);
        }
        .join-cta { width:100%; margin-top:2px; }
        .join-cta .btn-join {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            color: var(--text-primary);
            background: rgba(20, 16, 31, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(120, 80, 255, 0.2);
            border-radius: var(--radius-btn);
            cursor: default;
        }
        .join-cta .btn-join .arrow {
            display: inline-block;
            font-size: 1.3rem;
            animation: bobDown 1.8s ease-in-out infinite;
            color: var(--accent-purple);
        }
        @keyframes bobDown {
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(6px);}
        }
        .roblox-btn-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .btn-roblox {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 20px 18px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
            background: rgba(42, 26, 74, 0.85);
            backdrop-filter: blur(6px);
            border: 1.5px solid rgba(120, 80, 255, 0.3);
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            text-align: center;
        }
        .btn-roblox:hover {
            transform: translateY(-2px);
            background: rgba(53, 34, 90, 0.9);
            border-color: rgba(120, 80, 255, 0.5);
        }
        .btn-roblox .icon { font-size: 1.5rem; }
        .btn-subnote {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        .divider-or {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 2px 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            gap: 10px;
        }
        .divider-or .line {
            flex: 1;
            max-width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(120,80,255,0.25), transparent);
        }
        .btn-copy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 20px 18px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            background: rgba(20, 16, 31, 0.7);
            backdrop-filter: blur(6px);
            border: 1.5px solid rgba(120, 80, 255, 0.15);
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-copy:hover {
            background: rgba(30, 24, 50, 0.8);
            border-color: rgba(120, 80, 255, 0.3);
            transform: translateY(-1px);
        }
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 6px 0;
        }
        .qr-section .qr-image {
            width: 180px;
            max-width: 65%;
            aspect-ratio: 1/1;
            border-radius: 16px;
            background: rgba(14,10,26,0.7);
            padding: 8px;
            border: 1px solid rgba(120,80,255,0.12);
        }
        .qr-section .qr-image img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background: #fff;
        }
        .qr-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            opacity: 0.7;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(20,16,31,0.95);
            backdrop-filter: blur(16px);
            padding: 14px 24px;
            border-radius: 14px;
            border: 1px solid rgba(120,80,255,0.25);
            color: var(--text-primary);
            font-size: 0.85rem;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .video-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-modal.open {
            display: flex;
            opacity: 1;
        }
        .video-modal .modal-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.6rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-modal .modal-close:hover {
            background: rgba(255,255,255,0.15);
            transform: rotate(90deg);
        }
        .video-modal .modal-video-wrapper {
            position: relative;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16/9;
            border-radius: var(--radius-video);
            overflow: hidden;
            border: 2px solid rgba(120,80,255,0.3);
            background: #000;
        }
        .video-modal .modal-video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .copy-fallback {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }
        @media (max-width:430px) {
            .video-wrapper::before { font-size:3rem; }
            .video-modal .modal-close { top:12px; right:16px; width:36px; height:36px; font-size:1.3rem; }
        }
        @media (max-width:375px) {
            .video-wrapper::before { font-size:2.5rem; }
        }
        @media (max-width:320px) {
            .video-wrapper::before { font-size:2rem; }
        }
    </style>
</head>
<body>

    <div class="sparkles" id="sparkles"></div>

    <div class="toast" id="toast">
        <span class="toast-icon">✅</span>
        <span id="toastMessage">Already Copied! Paste it On any Browser and join</span>
    </div>

    <!-- VIDEO MODAL (Vimeo) -->
    <div class="video-modal" id="videoModal">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-video-wrapper">
            <iframe
                id="vimeoIframe"
                src=""
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                allowfullscreen
                loading="lazy"
                title="Tutorial video"
            ></iframe>
        </div>
    </div>

    <main class="container">

        <section class="profile-section">
            <div class="video-wrapper" id="videoTrigger" role="button" tabindex="0">
                <!-- Thumbnail: Puwede ninyong palitan ng sarili ninyong image -->
                <img
                    src="https://img.youtube.com/vi/6j3gtdkrKIA/hqdefault.jpg"
                    alt="Tutorial video thumbnail"
                    loading="lazy"
                />
            </div>
            <h1 class="profile-title">
                how to join? <span>watch the video tutorial</span>
            </h1>
        </section>

        <div class="join-cta">
            <div class="btn-join" aria-hidden="true">
                JOIN ME BELOW
                <span class="arrow">↓</span>
            </div>
        </div>

        <div class="roblox-btn-wrap">
            <a class="btn-roblox" href="https://bio.site/Ilovebacons" target="_blank" rel="noopener noreferrer">
                <span class="icon">🎮</span>
                MY ROBLOX PROFILE
            </a>
            <div class="btn-subnote">to join watch the video tutorial above</div>
        </div>

        <div class="divider-or" aria-hidden="true">
            <span class="line"></span>
            <span class="or-text">OR</span>
            <span class="line"></span>
        </div>

        <button class="btn-copy" id="copyBtn">
            <span class="copy-icon">📋</span>
            <span class="label"><strong>MY ROBLOX</strong> PROFILE LINK</span>
        </button>
        <input class="copy-fallback" id="copyFallback" type="text" value="https://bio.site/Ilovebacons" readonly />

        <div class="divider-or" aria-hidden="true">
            <span class="line"></span>
            <span class="or-text">OR</span>
            <span class="line"></span>
        </div>

        <section class="qr-section">
            <div class="qr-image">
                <img src="https://media.bio.site/sites/ee51f088-2ab5-49e6-ae44-8e3e7905838a/drafts/c4C2hzTgf8WskbHJFU8Mye.png" alt="QR code" loading="lazy" />
            </div>
            <div class="qr-label">scan the qr to join</div>
        </section>

    </main>

    <script>
        (function() {
            'use strict';

            const PROFILE_URL = 'https://bio.site/Ilovebacons';
            const TOAST_DURATION = 3200;

            // ═══════════════════════════════════════════════════════
            // ✅ NAKASET NA ANG IYONG VIMEO VIDEO ID
            const VIMEO_ID = '1224187524';
            // ═══════════════════════════════════════════════════════

            const copyBtn = document.getElementById('copyBtn');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const fallbackInput = document.getElementById('copyFallback');

            const videoTrigger = document.getElementById('videoTrigger');
            const videoModal = document.getElementById('videoModal');
            const modalClose = document.getElementById('modalClose');
            const vimeoIframe = document.getElementById('vimeoIframe');

            let toastTimer = null;

            function showToast(msg) {
                if (toastTimer) clearTimeout(toastTimer);
                toastMsg.textContent = msg || 'Already Copied! Paste it On any Browser and join';
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, TOAST_DURATION);
            }

            function hideToast() {
                if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
                toast.classList.remove('show');
            }

            function copyProfileLink() {
                hideToast();
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(PROFILE_URL)
                        .then(() => showToast('Already Copied! Paste it On any Browser and join'))
                        .catch(() => fallbackCopy());
                    return;
                }
                fallbackCopy();
            }

            function fallbackCopy() {
                try {
                    fallbackInput.value = PROFILE_URL;
                    fallbackInput.select();
                    fallbackInput.setSelectionRange(0, 99999);
                    if (document.execCommand('copy')) {
                        showToast('Already Copied! Paste it On any Browser and join');
                    } else {
                        manualCopyFallback();
                    }
                } catch (e) {
                    manualCopyFallback();
                }
                if (window.getSelection) window.getSelection().removeAllRanges();
                fallbackInput.blur();
            }

            function manualCopyFallback() {
                showToast(`Copy this link: ${PROFILE_URL}`);
                console.log('Manual copy needed:', PROFILE_URL);
            }

            function openModal() {
                // Vimeo embed URL with autoplay
                vimeoIframe.src = `https://player.vimeo.com/video/${VIMEO_ID}?autoplay=1&title=0&byline=0&portrait=0`;
                videoModal.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                videoModal.classList.remove('open');
                vimeoIframe.src = '';
                document.body.style.overflow = '';
            }

            videoTrigger.addEventListener('click', openModal);
            videoTrigger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
            });

            modalClose.addEventListener('click', closeModal);
            videoModal.addEventListener('click', (e) => {
                if (e.target === videoModal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && videoModal.classList.contains('open')) closeModal();
            });

            copyBtn.addEventListener('click', (e) => { e.preventDefault(); copyProfileLink(); });
            copyBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyProfileLink(); }
            });

            toast.addEventListener('click', hideToast);

            // Sparkles
            function generateSparkles() {
                const container = document.getElementById('sparkles');
                for (let i = 0; i < 45; i++) {
                    const el = document.createElement('div');
                    el.className = 'sparkle';
                    const x = Math.random() * 100, y = Math.random() * 100;
                    const size = 1.5 + Math.random() * 3;
                    const dur = 3 + Math.random() * 5, delay = Math.random() * 6;
                    el.style.cssText = `left:${x}%;top:${y}%;width:${size}px;height:${size}px;--dur:${dur}s;animation-delay:${delay}s;opacity:${0.2+Math.random()*0.5};`;
                    container.appendChild(el);
                }
            }
            generateSparkles();

            console.log('🚀 Roblox Join Page ready. Vimeo ID:', VIMEO_ID);
        })();
    </script>

</body>
</html>
